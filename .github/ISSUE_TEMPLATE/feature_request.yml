name: Feature request
description: Suggest a protocol feature, config option, or platform support.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](https://github.com/oltur/just-another-vpn-server/blob/main/ROADMAP.md) first — it may already be tracked (e.g. macOS `pfctl` NAT).

  - type: textarea
    id: problem
    attributes:
      label: What's missing or awkward today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A config key, CLI flag, or behavior change, if you have one in mind.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
